<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celldega Landscape</title>
  <style>
    html, body, #landscape {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    #landscape canvas {
      max-width: 100% !important;
      display: block;
    }
  </style>
</head>
<body>
  <div id="landscape"></div>

  <script type="module">
    import celldega from './celldega.js'

    console.log('using celldega.js, updated creds argument')

    const DEFAULT_CONFIG = {
      base_url:
        'https://raw.githubusercontent.com/broadinstitute/celldega_Xenium_Prime_Mouse_Brain_Coronal_FF_outs/main/Xenium_Prime_Mouse_Brain_Coronal_FF_outs',
      aws_creds: {},
      token: '',
      ini_x: 15500,
      ini_y: 12200,
      ini_z: 0,
      ini_zoom: -6,
      opacity_scale: 0.25,
      max_tiles_to_view: 6
    }

    let current_config = { ...DEFAULT_CONFIG }
    let received_post_message = false

    async function render_landscape() {
      const el = document.getElementById('landscape')

      el.innerHTML = ''

      const width = el.clientWidth || window.innerWidth
      const height = el.clientHeight || window.innerHeight

      console.log('rendering Celldega Landscape with config:', current_config)

      await celldega.landscape_ist(
        el,
        {},                          // ini_model
        current_config.token,
        current_config.ini_x,
        current_config.ini_y,
        current_config.ini_z,
        current_config.ini_zoom,
        current_config.base_url,
        '',                          // dataset_name
        current_config.opacity_scale, // trx_radius
        width,
        height,
        {},                          // meta_cell
        [],                          // meta_cell_attr
        {},                          // meta_cluster
        [],                          // meta_cluster_attr
        {},                          // umap
        {},                          // nbhd
        false,                       // nbhd_edit
        'spatial',                   // landscape_state
        'default',                   // segmentation
        current_config.aws_creds || {}, // creds
        null,                        // view_change_custom_callback
        0,                           // rotation_orbit
        0,                           // rotation_x
        0,                           // rotate
        current_config.max_tiles_to_view
      )
    }

    window.addEventListener('message', async (event) => {
      const data = event.data

      if (!data || data.type !== 'celldega:init') return

      received_post_message = true

      console.log('received celldega:init message:', data)

      current_config = {
        ...current_config,
        ...(data.base_url ? { base_url: data.base_url } : {}),
        ...(data.aws_creds ? { aws_creds: data.aws_creds } : {}),
        ...(data.creds ? { aws_creds: data.creds } : {}),
        ...(data.max_tiles_to_view ? { max_tiles_to_view: data.max_tiles_to_view } : {})
      }

      try {
        await render_landscape()
      } catch (error) {
        console.error('Celldega render failed after postMessage:', error)
      }
    })

    // Render the default placeholder only if no postMessage arrives quickly.
    // This avoids starting the default render right before the parent sends config.
    setTimeout(async () => {
      if (received_post_message) return

      try {
        await render_landscape()
      } catch (error) {
        console.error('Default Celldega render failed:', error)
      }
    }, 250)
  </script>
</body>
</html>
